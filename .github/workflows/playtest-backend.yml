name: Playtest backend integration
on:
  pull_request:
    paths: ['supabase/**', 'tests/playtest-*.mjs', 'tests/score-*.mjs', 'tests/online-*.mjs', '.github/workflows/playtest-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx --yes supabase@2.121.0 start
      - run: npx --yes supabase@2.121.0 db reset
      - run: npx --yes supabase@2.121.0 test db
      - if: always()
        run: npx --yes supabase@2.121.0 stop --no-backup
