<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101917"><title>Shambhala Side Quest</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='32'%3E✦%3C/text%3E%3C/svg%3E"></head>
<body data-mode="game"><main class="shell">
<header class="masthead"><span class="wordmark"><span class="brand-star">✳</span> SHAMBHALA<span class="wordmark-sub">SIDE QUEST</span></span><div class="header-actions"><button id="sound" class="quiet-button" aria-pressed="true">Sound on</button><button id="settings" class="quiet-button">Settings</button><button id="fullscreen" class="quiet-button" hidden>Fullscreen</button><button id="pause" class="quiet-button" disabled>Pause <kbd>Esc</kbd></button></div></header>
<section class="intro" hidden><strong id="best">000</strong></section>
<section class="game-frame" aria-label="Side Quest game">
<div class="hud"><div class="hud-score"><span id="stage-name">QUICK RUSH</span><strong id="score">000</strong></div><div class="combo"><div><span id="combo-label">FIND YOUR FLOW</span><strong id="multiplier">1×</strong></div><div class="combo-track"><div id="combo-fill"></div></div></div><div class="hud-time"><span>TIME LEFT</span><strong id="time">1:00</strong></div></div>
<div class="beat-bar"><div class="phase-copy"><span id="phase-title">NEXT DROP</span><strong id="phase-detail">15s</strong></div><div class="phase-track"><div id="phase-fill"></div></div><span id="spark-goal">✦ 0 sparks</span><span id="flow-status">◇ FIND FLOW</span><span class="passes-label"><b id="passes">0</b> PASSES</span></div>
<div class="arena-wrap"><div id="game" tabindex="0" role="application" aria-label="Forest game. Move with WASD, arrows, mouse or touch. Collect sparks; avoid dancers and speakers. Escape pauses."></div><div id="toast" class="toast" aria-live="polite"></div><div class="arena-caption" aria-hidden="true"><span>THE FOREST IS CALLING</span><span>✦ FOLLOW THE GLOW</span></div></div>
<div class="game-footer"><span id="shield-status"></span><span id="crowd-tip">Clean passes = +15</span></div>
<div id="menu" class="screen-layer" data-screen="title"><div id="avatar-preview" aria-label="Your raver preview" role="img"></div><section id="menu-content" class="menu-card" aria-label="Game menu"></section></div>
</section><footer class="page-footer" hidden></footer><p id="announcement" class="sr-only" aria-live="polite"></p>
</main><script type="module" src="/src/main.js"></script></body></html>
